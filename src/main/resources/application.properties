spring.application.name=portfolio

# Load local .env (properties format) when present.
spring.config.import=optional:file:.env[.properties]

# Server port from .env (environment variable: SERVER_PORT)
server.port=${SERVER_PORT:8080}


# Run schema.sql and data.sql on startup
spring.sql.init.mode=always



# MySQL Database Configuration (values from .env file)
# Environment variables: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=false
finnhub.api.key=d9mce0hr01qg1eudb5b0d9mce0hr01qg1eudb5bg
finnhub.base-url=https://finnhub.io/api/v1
finnhub.websocket-url=${FINNHUB_WEBSOCKET_URL:wss://ws.finnhub.io}
stock.live.subscription-refresh-ms=${STOCK_LIVE_SUBSCRIPTION_REFRESH_MS:60000}

# Gemini AI (override with GEMINI_API_KEY in .env or environment)
gemini.api.key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
