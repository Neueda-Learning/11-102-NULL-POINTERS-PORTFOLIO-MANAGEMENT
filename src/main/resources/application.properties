spring.application.name=portfolio

# Load local .env (properties format) when present.
spring.config.import=optional:file:.env[.properties]

# Server port from .env (environment variable: SERVER_PORT)
server.port=${SERVER_PORT:8080}

# Run schema.sql and data.sql on startup
spring.sql.init.mode=always

# Finnhub real-time quote API configuration
# Get your free API key from: https://finnhub.io
# Environment variable: FINNHUB_API_KEY (set via .env file)
finnhub.base-url=https://finnhub.io/api/v1

# MySQL Database Configuration (values from .env file)
# Environment variables: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=false
