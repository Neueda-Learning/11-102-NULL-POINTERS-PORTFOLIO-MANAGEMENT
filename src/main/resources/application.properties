spring.application.name=portfolio

# Load local environment file (kept out of git)
spring.config.import=optional:file:.env[.properties]

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql and data.sql on startup (creates tables + seeds if missing)
spring.sql.init.mode=always

finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.websocket-url=${FINNHUB_WEBSOCKET_URL:wss://ws.finnhub.io}
finnhub.mock-mode=${FINNHUB_MOCK_MODE:true}
stock.live.subscription-refresh-ms=${STOCK_LIVE_SUBSCRIPTION_REFRESH_MS:60000}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
