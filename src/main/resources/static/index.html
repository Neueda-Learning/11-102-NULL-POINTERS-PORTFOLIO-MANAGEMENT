<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Theme Initialization Script (Loads in head to prevent screen flashing) -->
    <script src="/js/theme.js"></script>
</head>
<body>

<header>
    <div>
        <h1 style="margin: 0;">Portfolio Manager</h1>
        <p style="color: var(--text-muted); margin-top: 4px;">Dashboard Overview</p>
    </div>

    <!-- Toggle Button -->
    <button id="theme-toggle-btn" class="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
</header>

<div class="card">
    <h2>Welcome to your Portfolio Dashboard</h2>
    <p style="color: var(--text-muted);">Dark and light mode is now active and will remember your setting across page reloads.</p>

    <div style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap;">
        <a href="/bonds.html" style="
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease;
        ">📊 Manage Bonds</a>
    </div>
</div>

</body>
</html>
